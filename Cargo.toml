[package]
name = "git-sprig"
version = "0.2.1"
edition = "2024"
rust-version = "1.88.0"
description = "Materialize git repositories and submodules as plain files without history"
license = "GPL-3.0-or-later"
homepage = "https://github.com/ancieg/git-sprig"
repository = "https://github.com/ancieg/git-sprig"
readme = "README.md"
keywords = ["git", "submodule", "vendoring", "gitoxide"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/TODO.md", "/.gitignore", "/.github"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.10"
clap_mangen = "0.3.3"
gix = { version = "0.87.1", default-features = false, features = [
    "sha1",
    "revision",
    "max-performance-safe",
    "auto-chain-error",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
signal-hook = "0.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
incremental = false
strip = true
